<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Object — flat-silhouette cover maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>One Object</h1>
    <p class="sub">One giant thing on a flat field. Your photo, posterized into
      a flat print, plus one huge title.</p>

    <div class="group">
      <span class="label">Layout</span>
      <div class="seg" id="layoutSeg">
        <button type="button" data-layout="A" class="on">A · Silhouette</button>
        <button type="button" data-layout="B">B · Object</button>
        <button type="button" data-layout="C">C · Shadow</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Preview size</span>
      <div class="seg" id="sizeSeg">
        <button type="button" data-size="1080x1080" class="on">1080 × 1080</button>
        <button type="button" data-size="1080x1350">1080 × 1350</button>
        <button type="button" data-size="1920x1080">1920 × 1080</button>
      </div>
      <span class="label">Export PNG</span>
      <div class="exports">
        <button type="button" data-export="1080x1080">1080 × 1080</button>
        <button type="button" data-export="1080x1350">1080 × 1350</button>
        <button type="button" data-export="1920x1080">1920 × 1080</button>
      </div>
      <p id="status" role="status"></p>
    </div>

    <div class="group">
      <span class="label">Photo — the object</span>
      <div class="tray" id="tray"></div>
      <label class="upload">Upload your own photo
        <input id="upload" type="file" accept="image/*">
      </label>
    </div>

    <div class="group row">
      <label>Inside the object
        <select id="photo2"></select>
      </label>
      <label>Miniature place
        <select id="location"></select>
      </label>
    </div>

    <div class="group">
      <span class="label">Field</span>
      <div class="swatches" id="fieldSwatches"></div>
    </div>

    <div class="group">
      <label>Posterize <span id="thresholdVal" class="val">55</span>
        <input id="threshold" type="range" min="0" max="100" value="55">
      </label>
      <div class="seg" id="tonesSeg">
        <button type="button" data-tones="2">2 tones</button>
        <button type="button" data-tones="3" class="on">3 tones</button>
      </div>
    </div>

    <div class="group row">
      <label class="check"><input id="neon" type="checkbox" checked> Neon</label>
      <label>Sunset <span id="sunsetVal" class="val">70</span>
        <input id="sunset" type="range" min="0" max="100" value="70">
      </label>
    </div>

    <div class="group">
      <label>Title
        <input id="caption" type="text" maxlength="40" value="SUNSET HEIST">
      </label>
      <label>Tagline
        <input id="tagline" type="text" maxlength="60" value="HE CAME BACK FOR THE SUNSET">
      </label>
    </div>

    <div class="group">
      <label>Zoom <input id="zoom" type="range" min="80" max="250" value="100"></label>
      <p class="hint">Drag the preview to pan the photo · scroll to zoom.</p>
    </div>
  </section>
  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
